name: CI

# Chaque push sur main : lint + tests.
# Si la version de livedeck/__init__.py n'a pas encore de release, l'installateur Windows est compilé
# et la release vX.Y.Z est publiée avec les notes du CHANGELOG (tools/release.py prépare tout ça).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dépendances
        run: pip install -r requirements.txt pyflakes

      - name: Lint
        run: python -m pyflakes livedeck tests tools main.py

      - name: Tests
        run: python tests/test_core.py

  release:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30  # sans cela, une étape bloquée occupe le groupe de concurrence pendant 6 h
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Version
        id: v
        shell: bash
        run: |
          V=$(python -c "import livedeck; print(livedeck.__version__)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::La release v$V existe déjà : rien à publier. Monte la version (tools/release.py) pour en sortir une nouvelle."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            python tools/release_notes.py "$V" > notes.md
          fi

      - name: Dépendances
        if: steps.v.outputs.new == 'true'
        run: |
          pip install -r requirements-build.txt
          python -m livedeck.setup_hidapi

      - name: Inno Setup
        if: steps.v.outputs.new == 'true'
        shell: bash
        run: |
          # préinstallé sur les runners Windows ; sinon on l'ajoute
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi

      - name: Compilation de l'installateur
        if: steps.v.outputs.new == 'true'
        run: python tools/build_exe.py --version ${{ steps.v.outputs.version }}

      - name: Vérification de l'installateur
        if: steps.v.outputs.new == 'true'
        shell: bash
        run: |
          # installation silencieuse, puis auto-test de l'exe installé
          APP="$RUNNER_TEMP/livedeck-app"
          ./dist/LiveDeck-${{ steps.v.outputs.version }}-win64-setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$(cygpath -w "$APP")"
          test -f "$APP/LiveDeck.exe"
          test -f "$APP/unins000.exe"
          export LIVEDECK_HOME="$RUNNER_TEMP/livedeck-selftest"
          # L'auto-test se ferme tout seul : on le lance au premier plan, borné dans le temps.
          # Surtout PAS en tâche de fond : le processus garderait le tuyau de sortie de l'étape
          # ouvert et l'étape ne se terminerait jamais, même après un « kill » — qui ne tue de
          # toute façon pas un processus Windows de façon fiable depuis Git Bash.
          timeout 180 "$APP/LiveDeck.exe" --selftest || echo "auto-test interrompu (code $?)"
          taskkill //F //IM LiveDeck.exe //T > /dev/null 2>&1 || true
          cat "$LIVEDECK_HOME/selftest.txt"
          # l'exe installé démarre, embarque pynput et hidapi (USB des Stream Decks)
          grep -q "^OK LiveDeck ${{ steps.v.outputs.version }}" "$LIVEDECK_HOME/selftest.txt"
          grep -q "^clavier=ok" "$LIVEDECK_HOME/selftest.txt"
          grep -Eq "^decks=[0-9]+ deck" "$LIVEDECK_HOME/selftest.txt"

      - name: Artefact
        if: steps.v.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LiveDeck-${{ steps.v.outputs.version }}-win64-setup
          path: dist/*-setup.exe

      - name: Publication de la release
        if: steps.v.outputs.new == 'true'
        shell: bash
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/*-setup.exe \
            --target "$GITHUB_SHA" \
            --title "LiveDeck ${{ steps.v.outputs.version }}" \
            --notes-file notes.md
